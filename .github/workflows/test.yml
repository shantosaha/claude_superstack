name: Verify Install

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify-install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify hook registration is sound
        run: bash test/verify-install.sh
