<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Cyan Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Purple Glow -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes lineFlow {
      0% {
        stroke-dashoffset: 40;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    @keyframes syncPulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #22d3ee); }
      100% { opacity: 0.3; }
    }

    @keyframes dataStream {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(120px); opacity: 0; }
    }

    .bg { fill: url(#bgGrad); }
    
    .tree-line {
      fill: none;
      stroke: #334155;
      stroke-width: 2;
    }

    .active-flow {
      fill: none;
      stroke: #22d3ee;
      stroke-dasharray: 8 12;
      stroke-width: 2;
      animation: lineFlow 2s linear infinite;
    }

    .purple-flow {
      fill: none;
      stroke: #a855f7;
      stroke-dasharray: 8 12;
      stroke-width: 2;
      animation: lineFlow 2s linear infinite;
    }

    .folder-icon {
      fill: #3b82f6;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .vault-icon {
      fill: #a855f7;
    }

    .graph-icon {
      fill: #ec4899;
    }

    .file-icon {
      fill: #94a3b8;
    }

    .sync-node {
      animation: syncPulse 3s ease-in-out infinite;
    }

    .pulse-delay-1 {
      animation-delay: -1s;
    }

    .pulse-delay-2 {
      animation-delay: -2s;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" rx="12" />

  <!-- Directory Tree Layout Lines -->
  <!-- Main Trunk -->
  <path d="M 60,60 L 60,205" class="tree-line" />
  
  <!-- Branches -->
  <path d="M 60,95 L 90,95" class="tree-line" />
  <path d="M 60,135 L 90,135" class="tree-line" />
  <path d="M 60,175 L 90,175" class="tree-line" />
  <path d="M 60,205 L 90,205" class="tree-line" />

  <!-- Active Data Flows (Simulating synchronization) -->
  <path d="M 60,95 L 90,95" class="purple-flow" />
  <path d="M 60,135 L 90,135" class="active-flow" />

  <!-- Root Directory -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="160" height="35" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <!-- Folder Icon SVG Path -->
    <path d="M 15,10 L 25,10 L 30,15 L 45,15 L 45,28 L 15,28 Z" class="folder-icon" />
    <text x="55" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">your-project/</text>
  </g>

  <!-- Level 1: CLAUDE.md -->
  <g transform="translate(90, 80)">
    <rect x="0" y="0" width="180" height="30" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
    <!-- File Icon -->
    <path d="M 15,7 L 27,7 L 33,13 L 33,23 L 15,23 Z" class="file-icon" style="fill: #a855f7;" />
    <text x="45" y="19" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CLAUDE.md</text>
    <text x="125" y="19" fill="#a855f7" font-family="system-ui, sans-serif" font-size="9" font-weight="500" class="sync-node">GLOBAL ROUTER</text>
  </g>

  <!-- Level 1: .vault/ -->
  <g transform="translate(90, 120)">
    <rect x="0" y="0" width="180" height="30" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="1.2" />
    <!-- Folder Icon -->
    <path d="M 15,7 L 23,7 L 27,11 L 33,11 L 33,23 L 15,23 Z" class="folder-icon vault-icon" style="fill: #22d3ee;" />
    <text x="45" y="19" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">.vault/</text>
    <text x="95" y="19" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="9" font-weight="500" class="sync-node pulse-delay-1">OBSIDIAN MEMORY</text>
  </g>

  <!-- Level 1: graphify-out/ -->
  <g transform="translate(90, 160)">
    <rect x="0" y="0" width="180" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <!-- Folder Icon -->
    <path d="M 15,7 L 23,7 L 27,11 L 33,11 L 33,23 L 15,23 Z" class="folder-icon graph-icon" style="fill: #ec4899;" />
    <text x="45" y="19" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">graphify-out/</text>
    <text x="110" y="19" fill="#ec4899" font-family="system-ui, sans-serif" font-size="9" font-weight="500" class="sync-node pulse-delay-2">CODE GRAPH</text>
  </g>

  <!-- Level 1: .superstack.json -->
  <g transform="translate(90, 200)">
    <rect x="0" y="0" width="180" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <!-- File Icon -->
    <path d="M 15,7 L 27,7 L 33,13 L 33,23 L 15,23 Z" class="file-icon" />
    <text x="45" y="19" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">.superstack.json</text>
  </g>

  <!-- Visual Sync Connector Panel (Right Side) -->
  <g transform="translate(380, 40)">
    <!-- Decorative Grid Box -->
    <rect x="0" y="0" width="370" height="180" rx="8" fill="#070a13" stroke="#1e293b" stroke-width="1.5" />
    <text x="15" y="25" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" letter-spacing="1">SYNCHRONIZATION INTERFACE</text>
    
    <!-- Connector Nodes -->
    <!-- Vault Node -->
    <circle cx="50" cy="90" r="16" fill="#0f172a" stroke="#22d3ee" stroke-width="2" filter="url(#cyanGlow)" />
    <path d="M 44,87 L 56,87 M 50,81 L 50,93 M 46,90 L 54,90" fill="none" stroke="#22d3ee" stroke-width="1.5" />
    <text x="50" y="125" text-anchor="middle" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">VAULT</text>

    <!-- Global Router Node (CLAUDE.md) -->
    <circle cx="320" cy="90" r="16" fill="#0f172a" stroke="#a855f7" stroke-width="2" filter="url(#purpleGlow)" />
    <polygon points="320,80 327,93 313,93" fill="none" stroke="#a855f7" stroke-width="1.5" />
    <text x="320" y="125" text-anchor="middle" fill="#a855f7" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">CLAUDE.md</text>

    <!-- Live Sync Pipeline Lines -->
    <path d="M 66,90 L 304,90" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
    <path d="M 66,90 L 304,90" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="10 15" stroke-linecap="round" class="active-flow" />

    <!-- Text status -->
    <rect x="110" y="145" width="150" height="22" rx="4" fill="#0c1020" stroke="#334155" stroke-width="1" />
    <circle cx="123" cy="156" r="3" fill="#10b981" class="sync-node" />
    <text x="135" y="159" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" letter-spacing="0.5">VAULT SYNC ACTIVE</text>
  </g>
</svg>
