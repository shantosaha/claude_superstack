<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Purple Glow Filter -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for Waves/Cables -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes pulse {
      0% {
        transform: scale(0.96);
        filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.4));
      }
      50% {
        transform: scale(1.04);
        filter: drop-shadow(0 0 25px rgba(34, 211, 238, 0.8)) drop-shadow(0 0 40px rgba(168, 85, 247, 0.5));
      }
      100% {
        transform: scale(0.96);
        filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.4));
      }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0px); }
    }

    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes rotateRingRev {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -40px;
      }
    }

    @keyframes scanline {
      0% {
        transform: translateY(-100%);
      }
      100% {
        transform: translateY(100%);
      }
    }

    /* Core Styles */
    .bg { fill: url(#bgGrad); }
    
    .router-group {
      transform-origin: 400px 175px;
      animation: pulse 4s ease-in-out infinite;
    }

    .ring-outer {
      fill: none;
      stroke: #a855f7;
      stroke-width: 2;
      stroke-dasharray: 40 180 80 40;
      transform-origin: 400px 175px;
      animation: rotateRing 20s linear infinite;
    }

    .ring-inner {
      fill: none;
      stroke: #22d3ee;
      stroke-width: 1.5;
      stroke-dasharray: 30 50;
      transform-origin: 400px 175px;
      animation: rotateRingRev 15s linear infinite;
    }

    .node {
      animation: float 6s ease-in-out infinite;
    }

    .node:nth-child(2n) {
      animation-delay: -3s;
    }

    .connection-line {
      stroke-dasharray: 8 12;
      animation: dash 2.5s linear infinite;
    }

    .pulse-dot {
      fill: #22d3ee;
      filter: url(#glow);
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" rx="12" />

  <!-- Grid Overlay (Techno style) -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="350" />
    <line x1="200" y1="0" x2="200" y2="350" />
    <line x1="300" y1="0" x2="300" y2="350" />
    <line x1="400" y1="0" x2="400" y2="350" />
    <line x1="500" y1="0" x2="500" y2="350" />
    <line x1="600" y1="0" x2="600" y2="350" />
    <line x1="700" y1="0" x2="700" y2="350" />
    <line x1="0" y1="87" x2="800" y2="87" />
    <line x1="0" y1="175" x2="800" y2="175" />
    <line x1="0" y1="262" x2="800" y2="262" />
  </g>

  <!-- Connection Lines (Underneath nodes) -->
  <!-- Left Side Connections -->
  <path d="M 400,175 L 120,60" fill="none" stroke="url(#cyanGrad)" stroke-width="2" class="connection-line" />
  <path d="M 400,175 L 100,140" fill="none" stroke="url(#cyanGrad)" stroke-width="2" class="connection-line" style="animation-duration: 3s;" />
  <path d="M 400,175 L 110,220" fill="none" stroke="url(#cyanGrad)" stroke-width="2" class="connection-line" style="animation-duration: 2s;" />
  <path d="M 400,175 L 150,290" fill="none" stroke="url(#cyanGrad)" stroke-width="2" class="connection-line" style="animation-duration: 4s;" />

  <!-- Right Side Connections -->
  <path d="M 400,175 L 680,60" fill="none" stroke="url(#purpleGrad)" stroke-width="2" class="connection-line" style="animation-duration: 3.5s;" />
  <path d="M 400,175 L 700,140" fill="none" stroke="url(#purpleGrad)" stroke-width="2" class="connection-line" style="animation-duration: 2.2s;" />
  <path d="M 400,175 L 690,220" fill="none" stroke="url(#purpleGrad)" stroke-width="2" class="connection-line" style="animation-duration: 1.8s;" />
  <path d="M 400,175 L 650,290" fill="none" stroke="url(#purpleGrad)" stroke-width="2" class="connection-line" style="animation-duration: 3.2s;" />

  <!-- Central Router -->
  <g class="router-group">
    <!-- Outer Purple Shield -->
    <circle cx="400" cy="175" r="55" fill="#a855f7" fill-opacity="0.05" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="400" cy="175" r="45" class="ring-outer" />
    <circle cx="400" cy="175" r="32" class="ring-inner" />
    
    <!-- Core Status -->
    <circle cx="400" cy="175" r="20" fill="#090d16" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow)" />
    <circle cx="400" cy="175" r="7" class="pulse-dot" />
    
    <!-- Interactive Overlay Text -->
    <text x="400" y="250" text-anchor="middle" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" letter-spacing="2" opacity="0.9">
      SUPERSTACK ACTIVE
    </text>
  </g>

  <!-- Left Side Nodes -->
  <g class="node" style="animation-delay: -1s;">
    <!-- Node 1: Obsidian -->
    <rect x="50" y="40" width="130" height="35" rx="6" fill="#0b1329" stroke="#22d3ee" stroke-width="1.5" />
    <circle cx="65" cy="57" r="4" fill="#22d3ee" filter="url(#glow)" />
    <text x="80" y="62" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">claude-obsidian</text>
  </g>

  <g class="node" style="animation-delay: -3.5s;">
    <!-- Node 2: Karpathy -->
    <rect x="30" y="120" width="130" height="35" rx="6" fill="#0b1329" stroke="#22d3ee" stroke-width="1.5" />
    <circle cx="45" cy="137" r="4" fill="#22d3ee" filter="url(#glow)" />
    <text x="60" y="142" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">karpathy-discipline</text>
  </g>

  <g class="node" style="animation-delay: -2s;">
    <!-- Node 3: Ponytail -->
    <rect x="40" y="200" width="130" height="35" rx="6" fill="#0b1329" stroke="#22d3ee" stroke-width="1.5" />
    <circle cx="55" cy="217" r="4" fill="#22d3ee" filter="url(#glow)" />
    <text x="70" y="222" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ponytail-minimal</text>
  </g>

  <g class="node" style="animation-delay: -4.5s;">
    <!-- Node 4: Graphify -->
    <rect x="80" y="270" width="130" height="35" rx="6" fill="#0b1329" stroke="#22d3ee" stroke-width="1.5" />
    <circle cx="95" cy="287" r="4" fill="#22d3ee" filter="url(#glow)" />
    <text x="110" y="292" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">graphify-memory</text>
  </g>

  <!-- Right Side Nodes -->
  <g class="node" style="animation-delay: -0.5s;">
    <!-- Node 5: Superpowers -->
    <rect x="620" y="40" width="130" height="35" rx="6" fill="#180e29" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="635" cy="57" r="4" fill="#a855f7" filter="url(#purpleGlow)" />
    <text x="650" y="62" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">superpowers-flow</text>
  </g>

  <g class="node" style="animation-delay: -2.5s;">
    <!-- Node 6: ECC Quality -->
    <rect x="640" y="120" width="130" height="35" rx="6" fill="#180e29" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="655" cy="137" r="4" fill="#a855f7" filter="url(#purpleGlow)" />
    <text x="670" y="142" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ecc-quality-gate</text>
  </g>

  <g class="node" style="animation-delay: -1.5s;">
    <!-- Node 7: UI/UX Pro -->
    <rect x="630" y="200" width="130" height="35" rx="6" fill="#180e29" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="645" cy="217" r="4" fill="#a855f7" filter="url(#purpleGlow)" />
    <text x="660" y="222" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ui-ux-pro-max</text>
  </g>

  <g class="node" style="animation-delay: -3.8s;">
    <!-- Node 8: GSD Core -->
    <rect x="590" y="270" width="130" height="35" rx="6" fill="#180e29" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="605" cy="287" r="4" fill="#a855f7" filter="url(#purpleGlow)" />
    <text x="620" y="292" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">gsd-core-workflow</text>
  </g>
</svg>
